version: "3.8"

services:
  # High-performance Nginx web server serving the static portfolio site
  portfolio-web:
    image: nginx:alpine
    container_name: portfolio-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-html:/usr/share/nginx/html:ro
    depends_on:
      - portfolio-watcher

  # Auto-watcher container: polls git repo, pulls changes, and auto-compiles static files
  portfolio-watcher:
    image: node:20-alpine
    container_name: portfolio-watcher
    restart: always
    environment:
      - GIT_POLL_INTERVAL=30
    volumes:
      - ../:/app
      - static-html:/out
    working_dir: /app
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache git && chmod +x /app/deploy/auto-builder.sh && /app/deploy/auto-builder.sh"]

volumes:
  static-html:
